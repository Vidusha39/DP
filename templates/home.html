{% extends 'base.html' %}

{% block title %}මුල් පිටුව - සාම දහම් පාසල{% endblock %}

{% block content %}
<div class="card-box"
    style="text-align: center; padding: 3rem 1.5rem; background: linear-gradient(180deg, #fffdf8 0%, #ffffff 100%); border-top: 4px solid var(--accent-gold);">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">☸</div>
    <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">සාම දහම් පාසල</h1>
    <p style="font-size: 1.15rem; color: var(--text-muted); max-width: 650px; margin: 0 auto 2rem auto;">
        දහම් පාසල් කළමනාකරණ තොරතුරු පද්ධතිය.
    </p>

    <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
        <a href="{% url 'public_register' %}" class="btn btn-primary"
            style="font-size: 1.1rem; padding: 0.85rem 1.8rem;">
            📝 නව ශිෂ්‍ය ලියාපදිංචිය (Online Registration)
        </a>
        <a href="{% url 'login' %}" class="btn btn-outline" style="font-size: 1.1rem; padding: 0.85rem 1.8rem;">
            🔐 ආචාර්ය මණ්ඩල ප්‍රවේශය (Staff Login)
        </a>
    </div>
</div>




{% endblock %}
